[project]
name = "regionalflash"
version = "0.1.0"
description = "5.5 km European regional AI weather forecasting dataset (CERRA + future radar/satellite) and tiled diffusion pipeline"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "xarray>=2025.1",
    "zarr>=3.1",
    "numcodecs>=0.13",
    "netcdf4>=1.7",
    "cfgrib>=0.9.14",
    "eccodes>=2.38",
    "scipy>=1.13",
    "cdsapi>=0.7",
    "huggingface-hub>=0.26",
    "tqdm>=4.66",
    "eccodeslib>=2.50.0.34",
    "h5py>=3.16.0",
    "pyproj>=3.7.2",
    "gcsfs>=2026.10.1",
    "aiohttp>=3.14.5",
]

[project.optional-dependencies]
train = [
    "torch>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
